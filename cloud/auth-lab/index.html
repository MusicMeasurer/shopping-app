<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShoppingApp · Auth Lab</title>
<style>body{font:16px system-ui;background:#111827;color:#f9fafb;margin:0;padding:24px}main{max-width:460px;margin:auto}label{display:block;margin-top:16px}input{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border-radius:8px;border:1px solid #6b7280;background:#1f2937;color:white;font-size:16px}button{padding:12px;margin:14px 8px 0 0;border:0;border-radius:8px;background:#34d399;color:#052e26;font-weight:700}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1f2937;padding:14px;border-radius:8px}small{color:#d1d5db}</style></head>
<body><main><h1>ShoppingApp · Auth Lab</h1><p>Только проверка входа. Запросы к таблицам отключены.</p>
<label>Supabase publishable key (sb_publishable_...)<input id="key" type="password" autocomplete="off" spellcheck="false"></label>
<label>Email тестового пользователя<input id="email" type="email" autocomplete="username"></label>
<label>Пароль<input id="password" type="password" autocomplete="current-password"></label>
<button id="login">Войти</button><button id="check">Проверить сессию</button><button id="logout">Выйти</button>
<p><small>Ключ, пароль и токен хранятся только в памяти этой вкладки, не записываются в GitHub или localStorage. Не присылайте их в чат. После перезагрузки страницы нужно войти снова.</small></p><pre id="status">Готово к проверке.</pre></main>
<script>
const base='https://tdcrtwpewbngoermckmx.supabase.co';
let accessToken=null;
const el=id=>document.getElementById(id);
const status=t=>{el('status').textContent=t};
async function call(path,options={}){
 const key=el('key').value.trim();
 if(!key.startsWith('sb_publishable_'))throw Error('Укажите publishable key');
 const headers={'apikey':key,'Content-Type':'application/json',...options.headers};
 const response=await fetch(base+path,{...options,headers});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error('HTTP '+response.status+': '+(data.msg||data.error_description||data.message||data.error||'Request failed'));
 return data;
}
el('login').onclick=async()=>{status('Проверяю вход…');try{
 const data=await call('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:el('email').value.trim(),password:el('password').value})});
 accessToken=data.access_token;el('password').value='';
 status('Вход выполнен. ID пользователя: '+(data.user?.id||'не получен')+'\nEmail: '+(data.user?.email||'не получен')+'\nТокен не отображается.');
}catch(e){accessToken=null;status('Ошибка входа: '+e.message)}};
el('check').onclick=async()=>{if(!accessToken){status('Сначала войдите.');return}status('Проверяю сессию…');try{
 const user=await call('/auth/v1/user',{headers:{Authorization:'Bearer '+accessToken}});
 status('Сессия действительна.\nID пользователя: '+user.id+'\nEmail: '+user.email);
}catch(e){status('Ошибка проверки: '+e.message)}};
el('logout').onclick=async()=>{if(!accessToken){status('Активной сессии нет.');return}try{
 await call('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+accessToken}});
 status('Выход выполнен.');
}catch(e){status('Серверный выход не подтверждён: '+e.message+'\nЛокальный токен очищен.')}finally{accessToken=null;el('password').value=''}};
</script></body></html>
