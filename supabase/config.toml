[auth]
enable_signup = false
minimum_password_length = 8

[auth.email]
otp_length = 6

# Siri uses an independently scoped, revocable bearer token in its handler.
# Supabase account JWT validation must be disabled for this function only.
# The handler must still authenticate every request against the hashed
# credential in Postgres. Do not deploy before lab integration/security tests.
[functions.siri-add]
verify_jwt = false

# Only the scheduler bearer is accepted by the handler.
[functions.account-deletion-worker]
verify_jwt = false

[functions.private-registration]
verify_jwt = false
