name: E3 Typecheck, build and unit tests
on:
  push:
    branches: [feature/e3-cloud-auth]
  pull_request:
    branches: [feature/cloud-schema-draft]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
