name: E3 Typecheck, build and unit tests
on:
  push:
    branches: [feature/e3-cloud-auth]
  pull_request:
    branches: [feature/cloud-schema-draft]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx playwright test tests/siri-browser-smoke.spec.ts

  siri-http-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify deployed disposable Siri HTTP endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://gmrqeubhotjpmtwokfeq.supabase.co/functions/v1/siri-add'
          check() {
            local expected="$1"; shift
            local actual
            actual=$(curl --silent --show-error --retry 2 --max-time 20 --output /tmp/siri-response --write-out '%{http_code}' "$@" "$endpoint")
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected HTTP $expected; got $actual"
              cat /tmp/siri-response
              exit 1
            fi
          }
          check 405 -X GET
          check 415 -X POST -H 'Content-Type: text/plain' --data 'hello'
          check 401 -X POST -H 'Content-Type: application/json' --data '{}'
          check 400 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $(printf 'a%.0s' {1..64})" --data '{broken'
          check 400 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $(printf 'a%.0s' {1..64})" --data '{}'
          check 403 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $(printf 'a%.0s' {1..64})" --data '{"operationId":"11111111-1111-4111-8111-111111111111","listId":"22222222-2222-4222-8222-222222222222","name":"test"}'
          echo 'PASS: deployed lab HTTP negative contract'


  real-auth-existing-user-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: e3-lab
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.E3_LAB_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E3_LAB_PUBLISHABLE_KEY }}
      E3_LAB_EMAIL: ${{ secrets.E3_USER_A_EMAIL }}
      E3_LAB_PASSWORD: ${{ secrets.E3_USER_A_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify pinned disposable lab and configured account A
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_SUPABASE_URL" = 'https://gmrqeubhotjpmtwokfeq.supabase.co'
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$E3_LAB_EMAIL"
          test -n "$E3_LAB_PASSWORD"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      # Both scenarios share the same hosted account A; avoid parallel auth/session traffic.
      - run: npx playwright test tests/authenticated-cloud-live.spec.ts --workers=1
