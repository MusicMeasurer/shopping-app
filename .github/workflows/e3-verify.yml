name: E3 Typecheck, build and unit tests
on:
  push:
    branches: [feature/e3-cloud-auth]
  pull_request:
    branches: [feature/cloud-schema-draft]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx playwright test tests/siri-browser-smoke.spec.ts

  siri-http-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify deployed disposable Siri HTTP endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://gmrqeubhotjpmtwokfeq.supabase.co/functions/v1/siri-add'
          check() {
            local expected="$1"; shift
            local actual
            actual=$(curl --silent --show-error --retry 2 --max-time 20 --output /tmp/siri-response --write-out '%{http_code}' "$@" "$endpoint")
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected HTTP $expected; got $actual"
              cat /tmp/siri-response
              exit 1
            fi
          }
          check 405 -X GET
          check 415 -X POST -H 'Content-Type: text/plain' --data 'hello'
          check 401 -X POST -H 'Content-Type: application/json' --data '{}'
          check 400 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $(printf 'a%.0s' {1..64})" --data '{broken'
          check 400 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $(printf 'a%.0s' {1..64})" --data '{}'
          check 403 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $(printf 'a%.0s' {1..64})" --data '{"operationId":"11111111-1111-4111-8111-111111111111","listId":"22222222-2222-4222-8222-222222222222","name":"test"}'
          echo 'PASS: deployed lab HTTP negative contract'

  real-auth-disposable-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: https://gmrqeubhotjpmtwokfeq.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iN1Oxw6kkBK0eEjvFy3YZw_4wWpwRJ3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Create isolated disposable user using official public signup API
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          import { randomBytes } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          const email = 'e3-browser-' + randomBytes(12).toString('hex') + '@example.com'
          const password = randomBytes(36).toString('base64url') + 'A1!'
          const client = createClient(process.env.VITE_SUPABASE_URL, process.env.VITE_SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          })
          const { data, error } = await client.auth.signUp({ email, password })
          if (error) throw new Error('Lab signup rejected: ' + error.message)
          if (!data.session) {
            throw new Error('Lab signup requires email confirmation; no authenticated browser session available. Use lab Auth settings or server-side admin createUser; never edit auth.users directly.')
          }
          appendFileSync(process.env.GITHUB_ENV, 'E3_LAB_EMAIL=' + email + '\\nE3_LAB_PASSWORD=' + password + '\\n')
          console.log('Lab signup returned an authenticated session. Credentials remain runner-only.')
          NODE
      - run: npm run build
      - run: npx playwright test tests/authenticated-cloud-live.spec.ts
