name: E3 disposable cloud integration (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e3-disposable-cloud-lab
  cancel-in-progress: false

jobs:
  cloud-integration:
    name: Real Supabase lab and IndexedDB reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e3-lab
    env:
      E3_LAB_URL: ${{ secrets.E3_LAB_URL }}
      E3_LAB_PUBLISHABLE_KEY: ${{ secrets.E3_LAB_PUBLISHABLE_KEY }}
      E3_USER_A_EMAIL: ${{ secrets.E3_USER_A_EMAIL }}
      E3_USER_A_PASSWORD: ${{ secrets.E3_USER_A_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check disposable lab configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E3_LAB_URL"
          test -n "$E3_LAB_PUBLISHABLE_KEY"
          test -n "$E3_USER_A_EMAIL"
          test -n "$E3_USER_A_PASSWORD"
          test "$E3_LAB_URL" = "https://gmrqeubhotjpmtwokfeq.supabase.co"
          [[ "$E3_LAB_PUBLISHABLE_KEY" == sb_publishable_* ]]
      - run: npm ci
      - name: Run real lab integration tests
        run: npx vitest run src/e3-local-cloud.integration.test.ts
