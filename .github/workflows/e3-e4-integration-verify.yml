name: E3 E4 integration checks
on:
  push:
    branches: [feature/e3-e4-integration, feature/local-profiles-foundation, feature/e4-accepted-reintegration, rollback/e4-indexeddb21]
  pull_request:
    branches: [feature/e3-cloud-auth, feature/e3-e4-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  e4-acceptance:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
  account-email:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      VITE_ACCOUNT_EMAIL_CODES: 'true'
      VITE_ACCOUNT_DELETION: 'true'
      VITE_SUPABASE_URL: https://account-email-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test tests/account-email.spec.ts
