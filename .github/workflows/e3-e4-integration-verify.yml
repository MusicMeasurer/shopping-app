name: E3 E4 integration checks
on:
  push:
    branches: [feature/e3-e4-integration]
  pull_request:
    branches: [feature/e3-cloud-auth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
