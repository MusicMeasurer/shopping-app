name: Disposable PostgreSQL invitation links 017
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invitation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppingapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoppingapp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shoppingapp_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-schema-draft
          persist-credentials: false
      - name: Bootstrap disposable Supabase-like roles and auth
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
          GRANT USAGE ON SCHEMA public,auth,extensions TO authenticated,anon;
          GRANT SELECT ON auth.users TO authenticated;
          SQL
      - name: Apply disposable draft migrations 001-016
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql
      - name: Apply REVIEW ONLY 017 in disposable database
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/017_invitation_links_REVIEW_ONLY.sql
      - name: Verify invitation acceptance and transfer with rollback
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/test_invitation_links.sql

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppingapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoppingapp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shoppingapp_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-schema-draft
          persist-credentials: false
      - name: Bootstrap disposable Supabase-like roles and auth
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
          GRANT USAGE ON SCHEMA public,auth,extensions TO authenticated,anon;
          GRANT SELECT ON auth.users TO authenticated;
          SQL
      - name: Apply disposable draft migrations 001-016
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql
      - name: Apply REVIEW ONLY 017 in disposable database
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/017_invitation_links_REVIEW_ONLY.sql
      - name: Verify concurrent invitation claimants
        run: bash tests/sql/run_invitation_race.sh

  expiry_revoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppingapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoppingapp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shoppingapp_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-schema-draft
          persist-credentials: false
      - name: Bootstrap disposable Supabase-like roles and auth
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
          GRANT USAGE ON SCHEMA public,auth,extensions TO authenticated,anon;
          GRANT SELECT ON auth.users TO authenticated;
          SQL
      - name: Apply disposable draft migrations 001-016
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql
      - name: Apply REVIEW ONLY 017 in disposable database
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/017_invitation_links_REVIEW_ONLY.sql
      - name: Verify 24-hour expiration and explicit owner revocation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/test_invitation_expiry_revoke_v2.sql
