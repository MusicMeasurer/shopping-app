name: Disposable invitation 017 audit candidate
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'cloud/drafts/017_invitation_links_AUDIT_FIX_REVIEW_ONLY.sql'
      - 'cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql'
      - 'tests/sql/test_invitation_*.sql'
      - 'tests/sql/run_invitation_lock_expiry.sh'
      - '.github/workflows/supabase-invitation-audit.yml'
  push:
    branches:
      - feature/cloud-schema-draft
    paths:
      - 'cloud/drafts/017_invitation_links_AUDIT_FIX_REVIEW_ONLY.sql'
      - 'cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql'
      - 'tests/sql/test_invitation_*.sql'
      - 'tests/sql/run_invitation_lock_expiry.sh'
      - '.github/workflows/supabase-invitation-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppingapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoppingapp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shoppingapp_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-schema-draft
          persist-credentials: false
      - name: Bootstrap disposable roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
          GRANT USAGE ON SCHEMA public,auth,extensions TO authenticated,anon;
          GRANT SELECT ON auth.users TO authenticated;
          SQL
      - name: Apply baseline 001-016
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql
      - name: Apply audit-fix candidate 017 in disposable database
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/017_invitation_links_AUDIT_FIX_REVIEW_ONLY.sql
      - name: Verify audit regressions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/test_invitation_audit_fixes.sql

      - name: Verify wall-clock expiry after transaction delay
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/test_invitation_wallclock_expiry.sql

      - name: Verify direct privileges and owner outsider access
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/test_invitation_permissions.sql

      - name: Exercise anonymous and member SQL denials
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/test_invitation_role_execution.sql

      - name: Verify expiry during concurrent list lock wait
        run: bash tests/sql/run_invitation_lock_expiry.sh
