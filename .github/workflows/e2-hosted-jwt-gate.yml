name: E2 hosted Supabase JWT A-B read-only gate
on:
  workflow_dispatch:
  pull_request:
    branches: [feature/cloud-schema-draft]
    paths:
      - 'tests/http/test_e2_hosted_acl.py'
      - '.github/workflows/e2-hosted-jwt-gate.yml'
permissions:
  contents: read
jobs:
  hosted-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_SUPABASE_URL: ${{ secrets.SHOPPINGAPP_TEST_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.SHOPPINGAPP_TEST_ANON_KEY }}
      TEST_EMAIL_A: ${{ secrets.SHOPPINGAPP_TEST_EMAIL_A }}
      TEST_EMAIL_B: ${{ secrets.SHOPPINGAPP_TEST_EMAIL_B }}
      TEST_PASSWORD_A: ${{ secrets.SHOPPINGAPP_TEST_PASSWORD_A }}
      TEST_PASSWORD_B: ${{ secrets.SHOPPINGAPP_TEST_PASSWORD_B }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify real hosted A/B/anonymous isolation (read-only)
        run: python3 tests/http/test_e2_hosted_acl.py
      - name: Evidence scope
        if: always()
        run: |
          echo '### Hosted Supabase JWT A/B gate' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read-only test; no database mutations, token printing or migration application.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Requires preexisting isolated A-owned list and valid short-lived JWTs.' >> "$GITHUB_STEP_SUMMARY"
