name: Deploy ShoppingApp to GitHub Pages

on:
  push:
    # Keep automatic verification of the interim branch, never production.
    branches: [release/interim-clean]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      VITE_SUPABASE_URL: https://tdcrtwpewbngoermckmx.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_J-vpyyyrVE27NTO1l-Q3ow_xDUzAcoR
      VITE_STORAGE_NAMESPACE: shopping-clean
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY -u VITE_STORAGE_NAMESPACE npm test
      - name: Build
        run: npm run build
      - name: Identify deployed revision
        run: git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > dist/revision.txt
      - name: Verify the clean PWA in Chromium and WebKit
        run: npx playwright test tests/interim-clean-deployment.spec.ts
      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
