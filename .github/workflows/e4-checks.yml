name: E4 checks (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e4-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit (informational)
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable})); console.log("TOTAL",JSON.stringify(a.metadata?.vulnerabilities))'
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
  dependency-remediation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inspect PWA dependency chain and available versions
        run: |
          npm ls vite-plugin-pwa workbox-build @rollup/plugin-node-resolve deepmerge glob minimatch || true
          npm view vite-plugin-pwa version
          npm view workbox-build version
          npm view glob version
          npm view minimatch version
      - name: Probe patched glob and minimatch via npm overrides (no commit)
        run: |
          npm pkg set 'overrides.glob=^14.0.4' 'overrides.minimatch=^11.0.5'
          npm install --package-lock-only --ignore-scripts
          npm ls glob minimatch || true
          git diff --stat -- package.json package-lock.json
      - name: Verify updated dependencies can install cleanly
        run: npm ci
      - name: Verify tests and production build after updates
        run: |
          npm test
          npm run build
      - name: Browser regression on patched dependency tree
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
      - name: Check remaining advisories (informational)
        run: |
          npm audit --json > remaining-audit.json || true
          node -e 'const a=require("./remaining-audit.json"); console.log("REMAINING",JSON.stringify(a.metadata?.vulnerabilities)); for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name,v.severity)'
  persist-verified-dependency-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/e4-lists-archive'
    needs: [dependency-remediation-probe, browser-e2e, build-and-unit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Persist tested dependency overrides and matching lockfile
        run: |
          npm pkg set 'overrides.glob=^14.0.4' 'overrides.minimatch=^11.0.5'
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=moderate
          if git diff --quiet -- package.json package-lock.json; then
            echo "Verified dependencies already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): pin audited glob and minimatch overrides"
          git push origin HEAD:${{ github.head_ref }}
