name: R4-W03 one-shot recovery delivery check
on:
  push:
    branches: [test/r4-w01-http-20261126]
    paths:
      - '.github/workflows/r4-w03-recovery-once.yml'
permissions:
  contents: read
concurrency:
  group: shoppingapp-r4-w01-http-lab
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: e3-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request one recovery email to approved A address
        env:
          E3_USER_A_EMAIL: ${{ secrets.E3_USER_A_EMAIL }}
        run: |
          python3 - <<'PY'
          import os, sys, re
          sys.path.insert(0, "tests/http")
          from r4_w01_safe_http import call, BASE
          assert BASE == "https://gmrqeubhotjpmtwokfeq.supabase.co"
          email = os.environ.get("E3_USER_A_EMAIL", "").strip()
          assert re.fullmatch(r"[^@\s]+@[^@\s]+\.[^@\s]+", email), "Approved A address unavailable"
          control = "r4-w03-recovery-control@example.invalid"
          assert email.lower() != control
          status, data = call("/auth/v1/settings")
          assert status == 200 and isinstance(data, dict) and data.get("disable_signup") is True, "Lab signup guard not confirmed"
          def safe_code(data):
              code = data.get("error_code", "") if isinstance(data, dict) else ""
              return code if isinstance(code, str) and re.fullmatch(r"[a-zA-Z0-9_]{1,60}", code) else ""
          existing_status, existing_body = call("/auth/v1/recover", {"email": email})
          print("Recovery A HTTP:", existing_status, safe_code(existing_body), flush=True)
          # Never verify a code, change a password, or repeat the real request.
          if existing_status != 200:
              print("STOP: recovery not accepted, no retry", flush=True)
              sys.exit(1)
          unknown_status, unknown_body = call("/auth/v1/recover", {"email": control})
          print("Recovery absent synthetic address HTTP:", unknown_status, safe_code(unknown_body), flush=True)
          equal = existing_status == unknown_status and existing_body == unknown_body
          print("Identical HTTP status and parsed body:", equal, flush=True)
          print("Actual inbox delivery requires recipient confirmation.", flush=True)
          sys.exit(0 if equal else 1)
          PY
