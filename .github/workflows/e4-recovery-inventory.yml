name: E4 lab recovery inventory static checks
on:
  push:
    branches: [feature/e4-accepted-reintegration]
    paths:
      - 'cloud/drafts/E4_LAB_RECOVERY_INVENTORY_2026-11-12.md'
      - 'cloud/drafts/*.sql'
      - 'tests/recovery/**'
      - '.github/workflows/e4-recovery-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/recovery -p 'test_*.py' -v
