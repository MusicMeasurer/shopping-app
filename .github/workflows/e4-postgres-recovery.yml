name: E4 isolated PostgreSQL recovery rehearsal
on:
  push:
    branches: [feature/e4-accepted-reintegration]
    paths:
      - 'cloud/drafts/**'
      - 'tests/recovery/**'
      - 'src/data/e4-cloud-list-create.ts'
      - 'src/data/e4-cloud-list-create.test.ts'
      - 'src/data/e4-cloud-list-operations.ts'
      - 'src/data/e4-cloud-list-operations.test.ts'
      - 'src/data/cloud-archive.ts'
      - 'src/data/cloud-archive.test.ts'
      - 'src/data/cloud-completion-preflight.ts'
      - 'src/data/cloud-completion-preflight.test.ts'
      - 'src/data/cloud-completion-rpc.ts'
      - 'src/data/cloud-completion-rpc.test.ts'
      - 'src/data/cloud-completion-coordinator.ts'
      - 'src/data/cloud-completion-coordinator.test.ts'
      - 'src/data/cloud-completion-failure.ts'
      - 'src/data/cloud-completion-failure.test.ts'
      - 'src/data/cloud-completion-storage.test.ts'
      - 'src/data/storage.ts'
      - 'src/AuthenticatedApp.tsx'
      - 'src/App.tsx'
      - 'src/App.completion.test.tsx'
      - 'tests/e4-completion-acceptance.spec.ts'
      - '.github/workflows/e4-postgres-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: shoppingapp_recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoppingapp_recovery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-disposable
      PGDATABASE: shoppingapp_recovery_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit regression
        run: npm test -- --run
      - name: Typecheck and build PWA
        run: npm run build
      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Run real browser E4 completion acceptance (mobile Chromium and WebKit)
        run: npx playwright test tests/e4-completion-acceptance.spec.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check captured recovery inventories
        run: python -m unittest discover -s tests/recovery -p 'test_*.py' -v
      - name: Audit live function source coverage and known gaps
        run: python tests/recovery/check_live_function_coverage.py
      - name: Bootstrap isolated Auth shim
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/bootstrap_pg.sql
      - name: Restore baseline 001-016
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql
      - name: Apply reviewed CI ACL normalization draft
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/018_acl_normalization_REVIEW_ONLY.sql
      - name: Set up disposable Supabase-style extensions schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/bootstrap_extensions_pg.sql
      - name: Restore invitation SQL 017 in isolated database
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/017_invitation_links_REVIEW_ONLY.sql
      - name: Restore Siri SQL 020 in isolated database
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/020_siri_add_REVIEW_ONLY.sql
      - name: Verify E3 RLS and scoped Siri execution rights
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_restored_e3.sql
      - name: Restore later E3 Siri pairing schema in isolated database
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/e3_pairing_schema_ci.sql
      - name: Restore five captured E3 app functions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/e3_pairing_functions_ci.sql
      - name: Apply reviewed E3 pairing RPC grants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/e3_pairing_acl_ci.sql
      - name: Verify later E3 pairing security and indefinite credentials
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_restored_e3_pairing.sql
      - name: Check restored baseline structure and security
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_restored_baseline.sql
      - name: Verify effective permissions
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql -X -v ON_ERROR_STOP=1 -At -f cloud/drafts/SECURITY_PREFLIGHT_READ_ONLY.sql)"
          if [ -n "$result" ]; then
            printf 'Effective ACL preflight violations:\n%s\n' "$result"
            exit 1
          fi
      - name: RLS A/B regression
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/test_acl_rls.sql
      - name: Create E4 archive snapshot schema in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/024_e4_archive_snapshot_SCHEMA_CI_ONLY.sql
      - name: Verify E4 archive RLS and snapshot durability
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_e4_archive_schema.sql
      - name: Apply E4 list metadata schema in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/022_e4_list_metadata_REVIEW_ONLY.sql
      - name: Verify E4 direct update privileges are closed
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_e4_metadata_acl.sql
      - name: Apply E4 versioned list metadata RPC in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/023_e4_list_metadata_rpc_REVIEW_ONLY.sql
      - name: Verify E4 metadata RPC ownership, replay, conflicts and ACL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_e4_metadata_rpc.sql
      - name: Concurrent E4 metadata writes must serialize safely
        run: python tests/recovery/test_e4_metadata_concurrency.py
      - name: Apply E4 list creation RPC in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/026_e4_list_create_RPC_CI_ONLY.sql
      - name: Verify E4 list creation ownership, idempotency and ACL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_e4_list_create_rpc.sql
      - name: Create E4 atomic completion RPC in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/025_e4_completion_RPC_CI_ONLY.sql
      - name: Test E4 completion, idempotency, isolation and sync tombstones
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_e4_completion_rpc.sql
      - name: Verify E4 A/B account isolation and completion rights
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_e4_hosted_ab_rls.sql
      - name: Concurrent E4 completion requests must serialize safely
        run: python tests/recovery/test_e4_completion_concurrency.py
      - name: Extend E4 transaction to delete lists
        run: psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/027_e4_list_delete_RPC_CI_ONLY.sql
      - name: Verify E4 deletion, archive preservation and owner scope
        run: psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_e4_list_delete_rpc.sql
      - name: Apply and test versioned E4 item attributes and list ordering
        run: |
          psql -X -v ON_ERROR_STOP=1 -f cloud/drafts/028_e4_item_attributes_RPC_CI_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/recovery/test_e4_item_attributes.sql
      - name: Verify no user data retained by recovery test
        run: |
          test "$(psql -X -v ON_ERROR_STOP=1 -At -c 'SELECT count(*) FROM public.shopping_lists')" = 0
