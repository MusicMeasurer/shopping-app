name: Rebuild disposable baseline 001-016 on PostgreSQL 17
on:
  workflow_dispatch:
  push:
    branches: [feature/cloud-schema-draft]
    paths:
      - 'cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql'
      - '.github/workflows/rebuild-baseline-17.yml'
      - 'tests/sql/hosted_baseline_object_names.txt'
      - 'tests/sql/baseline_security_inventory.sql'
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppingapp_rebuild
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d shoppingapp_rebuild"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shoppingapp_rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-schema-draft
          persist-credentials: false
      - name: Bootstrap Supabase role stubs in disposable DB
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
          GRANT USAGE ON SCHEMA public,auth,extensions TO authenticated,anon;
          GRANT SELECT ON auth.users TO authenticated;
          SQL
      - name: Create baseline from 001-016
        run: psql -v ON_ERROR_STOP=1 -f cloud/drafts/TEST_MIGRATIONS_ATOMIC_001_016.sql
      - name: Check critical baseline objects and no 017
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.shopping_lists') IS NULL
               OR to_regclass('public.list_members') IS NULL
               OR to_regclass('public.shopping_items') IS NULL
               OR to_regclass('public.list_invitation_links') IS NOT NULL
               OR to_regprocedure('public.transfer_list_ownership(uuid,uuid)') IS NULL
            THEN RAISE EXCEPTION 'Unexpected 001-016 baseline'; END IF;
          END $$;
          SQL
      - name: Record structural object inventory
        run: |
          psql -At -F '|' -v ON_ERROR_STOP=1 <<'SQL' > /tmp/baseline-inventory.txt
          SELECT 'table', c.relname, c.relrowsecurity::text
          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='public' AND c.relkind IN ('r','p')
          UNION ALL
          SELECT 'function', p.oid::regprocedure::text, p.prosecdef::text
          FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
          WHERE n.nspname='public'
          UNION ALL
          SELECT 'policy', tablename || '.' || policyname, cmd
          FROM pg_policies WHERE schemaname='public'
          UNION ALL
          SELECT 'trigger', t.tgrelid::regclass::text || '.' || t.tgname, pg_get_triggerdef(t.oid)
          FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid
          JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='public' AND NOT t.tgisinternal
          UNION ALL
          SELECT 'index', indexname, indexdef FROM pg_indexes WHERE schemaname='public'
          ORDER BY 1,2,3;
          SQL
          test -s /tmp/baseline-inventory.txt
          cat /tmp/baseline-inventory.txt
      - name: Compare application object names against hosted inventory
        run: |
          psql -At -v ON_ERROR_STOP=1 <<'SQL' | LC_ALL=C sort > /tmp/actual-object-names.txt
          SELECT 'table|' || c.relname
          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='public' AND c.relkind IN ('r','p')
          UNION ALL
          SELECT 'function|' || p.proname || '(' ||
                 COALESCE((SELECT string_agg(format_type(a.argtype, NULL), ',' ORDER BY a.ord)
                   FROM unnest(p.proargtypes::oid[]) WITH ORDINALITY AS a(argtype,ord)), '') || ')'
          FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
          WHERE n.nspname='public'
          UNION ALL
          SELECT 'policy|public.' || tablename || '.' || policyname
          FROM pg_policies WHERE schemaname='public'
          UNION ALL
          SELECT 'trigger|' || c.relname || '.' || t.tgname
          FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid
          JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='public' AND NOT t.tgisinternal
          UNION ALL
          SELECT 'index|public.' || indexname
          FROM pg_indexes WHERE schemaname='public';
          SQL
          LC_ALL=C sort tests/sql/hosted_baseline_object_names.txt > /tmp/expected-object-names.txt
          diff -u /tmp/expected-object-names.txt /tmp/actual-object-names.txt
      - name: Generate security and schema inventory
        run: |
          psql -X -v ON_ERROR_STOP=1 -P footer=off -F '|' -At \
            -f tests/sql/baseline_security_inventory.sql \
            > baseline-security-inventory.txt
          test -s baseline-security-inventory.txt
          echo "Inventory rows: $(wc -l < baseline-security-inventory.txt)"
      - name: Drill logical backup and restore into a second disposable PostgreSQL 17 database
        run: |
          set -euo pipefail
          pg_dump --format=custom --file=/tmp/shoppingapp-baseline.dump shoppingapp_rebuild
          createdb shoppingapp_restore_drill
          pg_restore --exit-on-error --dbname=shoppingapp_restore_drill /tmp/shoppingapp-baseline.dump
          PGDATABASE=shoppingapp_restore_drill psql -X -v ON_ERROR_STOP=1 -P footer=off -F '|' -At \
            -f tests/sql/baseline_security_inventory.sql \
            > /tmp/restored-security-inventory.txt
          diff -u baseline-security-inventory.txt /tmp/restored-security-inventory.txt
          psql -X -At -v ON_ERROR_STOP=1 -d shoppingapp_rebuild <<'SQL' > /tmp/source-objects.txt
          SELECT 'table|'||c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p')
          UNION ALL SELECT 'function|'||p.oid::regprocedure::text FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'
          UNION ALL SELECT 'index|'||indexname FROM pg_indexes WHERE schemaname='public'
          UNION ALL SELECT 'policy|'||tablename||'.'||policyname FROM pg_policies WHERE schemaname='public'
          UNION ALL SELECT 'trigger|'||c.relname||'.'||t.tgname FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal
          ORDER BY 1;
          SQL
          psql -X -At -v ON_ERROR_STOP=1 -d shoppingapp_restore_drill <<'SQL' > /tmp/restored-objects.txt
          SELECT 'table|'||c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p')
          UNION ALL SELECT 'function|'||p.oid::regprocedure::text FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'
          UNION ALL SELECT 'index|'||indexname FROM pg_indexes WHERE schemaname='public'
          UNION ALL SELECT 'policy|'||tablename||'.'||policyname FROM pg_policies WHERE schemaname='public'
          UNION ALL SELECT 'trigger|'||c.relname||'.'||t.tgname FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal
          ORDER BY 1;
          SQL
          diff -u /tmp/source-objects.txt /tmp/restored-objects.txt
          PGDATABASE=shoppingapp_restore_drill psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $ BEGIN
            IF to_regclass('public.list_invitation_links') IS NOT NULL THEN
              RAISE EXCEPTION 'Migration 017 object unexpectedly exists after restore';
            END IF;
          END $;
          SQL
          echo 'PG17 dump/restore drill passed; application object names and security inventory match.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload baseline inventory for hosted comparison
        uses: actions/upload-artifact@v4
        with:
          name: pg17-baseline-security-inventory
          path: baseline-security-inventory.txt
          retention-days: 14
      - name: Summarize limits
        run: |
          {
            echo '### PostgreSQL 17 disposable baseline'
            echo '001-016 applied successfully; object inventory generated.'
            echo 'This verifies clean bootstrap only. It does NOT compare with hosted Supabase,'
            echo 'test recovery of a hosted backup, or authorize applying 017.'
          } >> "$GITHUB_STEP_SUMMARY"
