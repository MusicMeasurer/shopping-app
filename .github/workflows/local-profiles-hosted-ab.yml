name: Local profiles hosted A/B integration (disposable lab)

on:
  push:
    branches: [feature/local-profiles-foundation]
    paths:
      - 'src/data/**'
      - 'src/e3-local-cloud.integration.test.ts'
      - 'tests/real-ab-lifecycle.spec.ts'
      - 'scripts/e3-real-session-gate.mjs'
      - 'scripts/e3-rpc-write-probe.mjs'
      - '.github/workflows/local-profiles-hosted-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-profiles-hosted-ab
  cancel-in-progress: false

jobs:
  hosted-ab:
    name: Real Auth A/B, RLS, RPC, offline queue and receipts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: e3-lab
    env:
      E3_LAB_URL: ${{ secrets.E3_LAB_URL }}
      E3_LAB_PUBLISHABLE_KEY: ${{ secrets.E3_LAB_PUBLISHABLE_KEY }}
      E3_USER_A_EMAIL: ${{ secrets.E3_USER_A_EMAIL }}
      E3_USER_A_PASSWORD: ${{ secrets.E3_USER_A_PASSWORD }}
      E3_USER_B_EMAIL: ${{ secrets.E3_USER_B_EMAIL }}
      E3_USER_B_PASSWORD: ${{ secrets.E3_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require pinned disposable lab and existing A/B secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in E3_LAB_URL E3_LAB_PUBLISHABLE_KEY E3_USER_A_EMAIL E3_USER_A_PASSWORD E3_USER_B_EMAIL E3_USER_B_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error title=Missing existing lab secret::$name is not configured"; exit 1; fi
          done
          [[ "$E3_LAB_URL" == "https://gmrqeubhotjpmtwokfeq.supabase.co" ]] || { echo "::error::Refusing non-lab target"; exit 1; }
          [[ "$E3_LAB_PUBLISHABLE_KEY" == sb_publishable_* ]] || { echo "::error::Publishable key required"; exit 1; }
      - run: npm ci
      - name: Install mobile browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build PWA against pinned disposable lab
        env:
          VITE_SUPABASE_URL: ${{ secrets.E3_LAB_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E3_LAB_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Real mobile browser A/B switch, guest isolation and offline reload
        env:
          VITE_SUPABASE_URL: ${{ secrets.E3_LAB_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E3_LAB_PUBLISHABLE_KEY }}
        run: npx playwright test tests/real-ab-lifecycle.spec.ts --workers=1
      - name: Real A/B authentication and forbidden cross-account access
        run: node scripts/e3-real-session-gate.mjs
      - name: Real RPC idempotency, version conflicts and cleanup
        run: node scripts/e3-rpc-write-probe.mjs
      - name: Real Supabase RPC to IndexedDB receipts and conflict recovery
        run: npx vitest run src/e3-local-cloud.integration.test.ts
